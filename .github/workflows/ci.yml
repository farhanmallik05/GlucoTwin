name: GlucoTwin CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite with Coverage
        env:
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -p no:langsmith --timeout=30 --disable-warnings -q

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build GlucoTwin API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/api/Dockerfile
          push: false
          tags: glucotwin-api:ci-test

      - name: Build GlucoTwin Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: src/dashboard
          file: src/dashboard/Dockerfile
          push: false
          tags: glucotwin-dashboard:ci-test
